[project]
name = "intering-cv-agentti"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.97.0",
    "pydantic>=2.13.3",
    "pdfplumber>=0.11.9",
    "python-dotenv>=1.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.4",
    "playwright>=1.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "backend"]
